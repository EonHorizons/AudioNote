name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/public-folder-mega-sync-td1jib
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check JitPack artifact status
        run: |
          echo "== TimerX build status =="
          curl -sS "https://jitpack.io/api/builds/com.github.arsvechkarev/TimerX/2.3.2" || true
          echo
          echo "== TimerX tags =="
          curl -sS "https://api.github.com/repos/arsvechkarev/TimerX/tags" || true
          echo
          echo "== PageIndicatorView build status =="
          curl -sS "https://jitpack.io/api/builds/com.github.romandanylyk/PageIndicatorView/1.0.3" || true
          echo
          echo "== PageIndicatorView tags =="
          curl -sS "https://api.github.com/repos/romandanylyk/PageIndicatorView/tags" || true
          echo

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audionote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
